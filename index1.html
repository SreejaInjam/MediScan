<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScan - Scan Medicine QR Codes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes scanLine {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(100%);
            }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }

        .pulse-animation {
            animation: pulse 2s ease-in-out infinite;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #ffffff 100%);
        }

        .scale-on-hover {
            transition: transform 0.3s ease;
        }

        .scale-on-hover:hover {
            transform: scale(1.05);
        }

        .qr-frame {
            position: relative;
            border: 2px solid #22c55e;
            border-radius: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
        }

        .qr-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #22c55e;
            animation: scanLine 2s linear infinite;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #qr-reader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.3);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        #loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #22c55e;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="gradient-bg min-h-screen">
    <!-- Loading Screen -->
    <div id="loading-screen" class="text-white">
        <div class="spinner mb-4"></div>
        <p class="text-lg">Opening medicine information...</p>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-12 text-center relative">
        <!-- Logo Section -->
        <div class="mb-8 float-animation">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto">
                <path d="m10.5 20.5 10-10a4.95 4.95 0=" />
            </svg>
        </div>

        <!-- Title with Gradient -->
        <h1 class="text-6xl font-bold mb-6 bg-gradient-to-r from-green-600 to-green-400 text-transparent bg-clip-text">
            MediScan
        </h1>

        <!-- QR Scan Section -->
        <div class="max-w-md mx-auto mb-16 qr-frame pulse-animation">
            <!-- Scan Button -->
            <button id="scan-btn" onclick="startScanner()" class="bg-green-500 hover:bg-green-600 text-white px-8 py-6 rounded-xl text-xl font-semibold shadow-lg hover:shadow-xl scale-on-hover inline-flex items-center justify-center w-full">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                    <rect width="5" height="5" x="3" y="3" rx="1"/>
                    <rect width="5" height="5" x="16" y="3" rx="1"/>
                    <rect width="5" height="5" x="3" y="16" rx="1"/>
                    <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
                    <path d="M21 21v.01"/>
                </svg>
                Tap to Scan QR Code
            </button>
        </div>
    </div>

    <!-- QR Scanner Modal -->
    <div class="overlay" id="overlay"></div>
    <div id="qr-reader"></div>

    <script>
        function startScanner() {
            const qrReader = document.getElementById('qr-reader');
            const overlay = document.getElementById('overlay');
            const loadingScreen = document.getElementById('loading-screen');
            const scanButton = document.getElementById('scan-btn');

            // Check for device camera permissions
            if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
                navigator.mediaDevices.enumerateDevices().then(devices => {
                    let cameraFound = devices.some(device => device.kind === 'videoinput');
                    if (!cameraFound) {
                        alert('No camera device found');
                        return;
                    }
                }).catch(error => {
                    console.error('Error checking for devices: ', error);
                    alert('Camera access failed');
                });
            }

            const scanner = new Html5QrcodeScanner('qr-reader', {
                fps: 10,
                qrbox: 250
            });

            // Show scanner modal and overlay
            overlay.style.display = 'block';
            qrReader.style.display = 'block';
            loadingScreen.style.display = 'none'; // Hide loading screen if scanner is shown
            scanButton.disabled = true; // Disable scan button

            // Handle QR scan result
            scanner.render((decodedText) => {
                // Stop the scanner
                scanner.clear();
                overlay.style.display = 'none';
                qrReader.style.display = 'none';
                scanButton.disabled = false;

                // Handle QR Code
                console.log('Scanned QR Code:', decodedText);
                displayMedicineInfo(decodedText); // Call to display the medicine info
            }).catch(error => {
                console.error('Scanner error:', error);
                alert('Error scanning QR code');
                overlay.style.display = 'none';
                qrReader.style.display = 'none';
                scanButton.disabled = false;
            });
        }

        function displayMedicineInfo(qrData) {
            // Placeholder function to display the information
            alert('Displaying information for: ' + qrData);
        }
    </script>
</body>

</html>
